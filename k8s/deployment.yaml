apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-api
  template:
    metadata:
      labels:
        app: product-api
    spec:
      containers:
      - name: product-api
        image: gcr.io/PROJECT_ID/product-api:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: product-api-svc
spec:
  type: LoadBalancer
  selector:
    app: product-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
