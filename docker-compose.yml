version: '3.8'
services:
  redis:
    image: redis:7-alpine
    container_name: productapi-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    restart: unless-stopped

  product-api:
    build: .
    container_name: productapi-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - PRODUCT_STORAGE_FILE=/app/data/products.json
      - SERVER_PORT=8080
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
